<div class="auth-wrapper">

  <div class="auth-card">

    <div class="auth-brand-header">
      <h2>Verify Code</h2>
      <p class="otp-subtitle">Enter the verification code sent to <strong>{{ username }}</strong></p>
    </div>

    <form [formGroup]="otpForm" (ngSubmit)="validateOTP()">

      <!-- OTP Boxes -->
      <div class="otp-box-group">
        <input
          *ngFor="let box of otpArray; let i = index; trackBy: trackByIndex"
          type="text"
          maxlength="1"
          inputmode="numeric"
          pattern="[0-9]*"
          class="otp-box"
          (input)="moveNext($event, i)"
          (keydown)="movePrev($event, i)"
        />
      </div>

      <!-- Error -->
      <div class="error-msg" *ngIf="otpForm.get('otp')?.touched && otpForm.get('otp')?.invalid">
        Verification code must be 4–6 digits
      </div>

      <!-- Button -->
      <button class="btn-submit" type="submit" [disabled]="loading">
        <ng-container *ngIf="!loading; else loadingTpl">Verify Code</ng-container>
        <ng-template #loadingTpl>
          <div class="auth-loading-wrapper">
            <span class="auth-spinner"></span>
            <span>Verifying...</span>
          </div>
        </ng-template>
      </button>

    </form>

    <div class="resend-container">
      Didn't receive code?
      <a class="resend-link">Resend Code</a>
    </div>

  </div>

</div>
