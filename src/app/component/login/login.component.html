<div class="auth-wrapper">

  <div class="auth-card">

    <div class="auth-brand-header">
      <h2>User Login</h2>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">

      <!-- Username -->
      <div class="input-pill-wrapper left-badge">
        <div class="badge-circle">
          <span class="material-icons">person_outline</span>
        </div>
        <input type="text" formControlName="username" placeholder="Username" autocomplete="username">
      </div>

      <!-- Password -->
      <div class="input-pill-wrapper right-badge">
        <input type="password" formControlName="password" placeholder="Password" autocomplete="current-password">
        <div class="badge-circle">
          <span class="material-icons">lock_outline</span>
        </div>
      </div>

      <!-- Action Button -->
      <button type="submit" [disabled]="loading" class="btn-pill-login">
        <ng-container *ngIf="!loading; else loadingTpl">LOGIN</ng-container>
        <ng-template #loadingTpl>
          <div class="auth-loading-wrapper">
            <span class="auth-spinner"></span>
            <span>LOGGING IN...</span>
          </div>
        </ng-template>
      </button>

    </form>

  </div>

</div>
